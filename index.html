<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Floating background elements -->
  <div class="bg-arena">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Pause overlay -->
  <div class="pause-overlay" id="pauseOverlay">
    <div class="pause-content">
      <div class="pause-icon">⏸️</div>
      <h2 class="pause-title">PAUSED</h2>
      <div class="pause-actions">
        <button class="pause-btn pause-resume" id="pauseResume">▶ RESUME</button>
        <button class="pause-btn pause-restart" id="pauseRestart">🔄 RESTART</button>
        <button class="pause-btn pause-menu" id="pauseMenu">📋 HOW TO PLAY</button>
        <button class="pause-btn pause-sound" id="pauseSound">🔊 SOUND</button>
      </div>
    </div>
  </div>

  <main class="arena">

    <!-- Title -->
    <h1 class="title">ROCK<br><span class="title-sub">PAPER</span><br>SCISSORS</h1>

    <!-- Menu bar -->
    <div class="menu-bar">
      <div class="menu-left">
        <div class="streak-box" id="streakBox">
          <span class="streak-fire" id="streakFire">🔥</span>
          <span class="streak-num" id="streakNum">0</span>
        </div>
      </div>
      <div class="menu-right">
        <button class="menu-btn" id="pauseBtn" title="Pause">⏸️</button>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card score-player">
        <span class="score-label">YOU</span>
        <span class="score-num" id="playerScore">0</span>
      </div>
      <div class="score-card score-computer">
        <span class="score-label">CPU</span>
        <span class="score-num" id="computerScore">0</span>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <span id="trialsDisplay">Matches: 0</span>
      <span id="winsDisplay">Wins: 0</span>
    </div>

    <!-- VS Display -->
    <div class="vs-display" id="vsDisplay">
      <div class="choice-slot" id="playerChoice">
        <span class="slot-label">YOU PICKED</span>
        <span class="slot-emoji" id="playerEmoji">❓</span>
      </div>
      <div class="vs-badge">VS</div>
      <div class="choice-slot" id="computerChoice">
        <span class="slot-label">CPU PICKED</span>
        <span class="slot-emoji" id="computerEmoji">❓</span>
      </div>
    </div>

    <!-- Result banner -->
    <div class="result-banner" id="resultBanner">
      <span id="resultDisplay"></span>
    </div>

    <p class="final-result" id="finalResultDisplay"></p>

    <!-- Choice buttons -->
    <div class="choices">
      <button class="choice-btn" data-choice="Rock">
        <span class="btn-emoji">🪨</span>
        <span class="btn-label">Rock</span>
      </button>
      <button class="choice-btn" data-choice="Paper">
        <span class="btn-emoji">📄</span>
        <span class="btn-label">Paper</span>
      </button>
      <button class="choice-btn" data-choice="Scissors">
        <span class="btn-emoji">✂️</span>
        <span class="btn-label">Scissors</span>
      </button>
    </div>

    <!-- Replay button -->
    <button class="replay-btn" id="replayBtn">Next Round</button>

  </main>

  <script src="index.js"></script>
</body>
</html>
